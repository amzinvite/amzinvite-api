name = "amzinvite-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ───────────────────────────────────────────────────────────────────────
# Bindings
# ───────────────────────────────────────────────────────────────────────

# D1 database — créée via `wrangler d1 create amzinvite-db`, puis colle
# l'ID retourné ci-dessous.
[[d1_databases]]
binding = "DB"
database_name = "mzinvite-db"
database_id = "4e80bd0f-e3b5-44f9-9925-47c1ae621b08"
migrations_dir = "migrations"

# Le rate limiting natif ne génère aucune lecture/écriture D1. Les clés sont
# isolées par usage afin qu'un type de trafic ne bloque pas les autres.
[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "41001"

[ratelimits.simple]
limit = 2
period = 60

[[ratelimits]]
name = "FEED_RATE_LIMITER"
namespace_id = "41002"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "41003"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "OBSERVATION_RATE_LIMITER"
namespace_id = "41004"

[ratelimits.simple]
limit = 30
period = 60

# Secrets : configurés via `wrangler secret put <NAME>`
# - ADMIN_TOKEN    : pour les endpoints d'upsert du catalogue
#
# Pas besoin de les déclarer ici, mais on les liste pour mémoire.

# Authentification stricte du feed public : les requêtes non signées et les
# signatures legacy sont rejetées.
[vars]
FEED_AUTH_ENFORCE = "true"
EXTENSION_LEGACY_AUTH_ENABLED = "false"
DATA_RETENTION_ENABLED = "true"
DATA_RETENTION_DAYS = "14"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

# CORS configuré dans le code (Cloudflare ne le fait pas auto pour Workers)
