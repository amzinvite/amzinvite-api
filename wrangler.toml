name = "amzinvite-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ───────────────────────────────────────────────────────────────────────
# Bindings
# ───────────────────────────────────────────────────────────────────────

# D1 database — créée via `wrangler d1 create amzinvite-db`, puis colle
# l'ID retourné ci-dessous.
[[d1_databases]]
binding = "DB"
database_name = "amzinvite-db"
database_id = "4e80bd0f-e3b5-44f9-9925-47c1ae621b08"
migrations_dir = "migrations"

# Le rate limiting natif ne génère aucune lecture/écriture D1. Les clés sont
# isolées par usage afin qu'un type de trafic ne bloque pas les autres.
[[ratelimits]]
name = "REGISTRATION_RATE_LIMITER"
namespace_id = "41001"

[ratelimits.simple]
limit = 2
period = 60

[[ratelimits]]
name = "FEED_RATE_LIMITER"
namespace_id = "41002"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "FEEDBACK_RATE_LIMITER"
namespace_id = "41003"

[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "OBSERVATION_RATE_LIMITER"
namespace_id = "41004"

[ratelimits.simple]
limit = 30
period = 60

# Secrets : configurés via `wrangler secret put <NAME>`
# - HMAC_SECRET    : clé legacy, requise uniquement pendant la migration v2
# - ADMIN_TOKEN    : pour les endpoints d'upsert du catalogue
#
# Pas besoin de les déclarer ici, mais on les liste pour mémoire.

# Période de grâce pour la signature du feed public :
#   "false" (défaut) → accepte les requêtes signées ET non signées, le temps
#                       que le Chrome Web Store pousse l'extension ≥0.1.14.
#   "true"           → strict, les requêtes non signées sont rejetées (401).
# Passer à "true" puis redéployer une fois l'extension signée largement adoptée.
[vars]
FEED_AUTH_ENFORCE = "false"
# Laisser à "true" pendant l'adoption de l'extension v2, puis passer à
# "false" pour supprimer définitivement le secret partagé historique.
EXTENSION_LEGACY_AUTH_ENABLED = "true"

[observability]
enabled = true

# CORS configuré dans le code (Cloudflare ne le fait pas auto pour Workers)
